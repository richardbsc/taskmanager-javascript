
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskManager | Gestión de Tareas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="header">
        <h1>TaskManager</h1>
        <p>Organiza tus actividades de manera sencilla</p>
    </header>

    <main class="container">

        <section class="dashboard">
            <div class="card">
                <h3>Total de tareas</h3>
                <span id="total">0</span>
            </div>

            <div class="card">
                <h3>Pendientes</h3>
                <span id="pendientes">0</span>
            </div>

            <div class="card">
                <h3>Completadas</h3>
                <span id="completadas">0</span>
            </div>
        </section>

        <section class="panel">
            <h2>Nueva tarea</h2>

            <form id="formTarea">
                <input
                    type="text"
                    id="titulo"
                    placeholder="Título de la tarea"
                >

                <textarea
                    id="descripcion"
                    placeholder="Descripción de la tarea"
                ></textarea>

                <select id="prioridad">
                    <option value="alta">Alta</option>
                    <option value="media" selected>Media</option>
                    <option value="baja">Baja</option>
                </select>

                <button type="submit">Guardar tarea</button>
            </form>
        </section>

        <section class="panel">
            <h2>Mis tareas</h2>

            <div class="herramientas">
                <input
                    type="search"
                    id="buscar"
                    placeholder="Buscar tarea..."
                >

                <select id="filtro">
                    <option value="todas">Todas</option>
                    <option value="pendientes">Pendientes</option>
                    <option value="completadas">Completadas</option>
                </select>

                <select id="orden">
                    <option value="fecha">Más recientes</option>
                    <option value="prioridad">Prioridad</option>
                </select>
            </div>

            <div id="listaTareas">
                <p class="vacio">Todavía no tienes tareas.</p>
            </div>
        </section>

    </main>

    <footer>
        <p>TaskManager - Proyecto JavaScript ES6+</p>
    </footer>

</body>
</html>
